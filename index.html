          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- REGISTRO -->
  <section class="container my-5">
    <h2 class="mb-3">Registro</h2>

    <p>
      Completa el formulario para recibir más información sobre nuestros productos
      y promociones exclusivas.

      Enviar
