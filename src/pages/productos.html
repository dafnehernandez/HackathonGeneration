<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubbler+One&family=Dosis:wght@200..800&display=swap" rel="stylesheet">
    <title>Producto</title>
    <link rel="stylesheet" href="/src/css/productos.css">
</head>

<body>

    <!-- Contenedor de olas animadas -->
    <div class="waves-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
            viewBox="0 20 190 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.2)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.15)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.1)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(255,255,255,0.05)" />
            </g>
        </svg>
    </div>

    <main>

        <!-- Contenedor principal con efecto de lluvia -->
        <div class="rain-image-container">
            <div class="rain-overlay"></div>
            <img src="/public/images/buceando.jpg" id="imagen-principal" alt="Portada">       
        </div>
        <div class="btn-group mb-4" role="group" aria-label="Filtros de categoría">
            <div class="contenedor-galerias">
                <!-- Pasamos el ID de la galería y el COLOR deseado como argumentos -->
                <!-- <button onclick="cambiarGaleria('serie-a','#FD6326')">Terrestre</button>
                <button onclick="cambiarGaleria('serie-b','#5C92D1')">Acuatico</button> -->
                <button onclick="cambiarTema('terrestre', '#FD6326')" class="btn-tema" id="btn-terrestre">Terrestre</button>
                <button onclick="cambiarTema('acuatico', '#129fae')" class="btn-tema" id="btn-acuatico">Acuático</button>
            
                <div id="serie-a" class="galeria">
                    <div class="tarjeta color-1">
                        <h3>Balones</h3>
                        <img src="/public/images/terrestre/balon.jpg" alt="Balones">
                    </div>
                    <div class="tarjeta color-2">
                        <h3>Gorras</h3>
                        <img src="/public/images/terrestre/gorras.jpg" alt="Gorras">
                    </div>
                    <div class="tarjeta color-3">
                        <h3>Guantes</h3>
                        <img src="/public/images/terrestre/guantes.jpg" alt="Guantes">

                    </div>
                    <div class="tarjeta color-4">
                        <h3>Lentes</h3>
                        <img src="/public/images/terrestre/lentes.jpg" alt="Lentes">
                    </div>
                    <div class="tarjeta color-5">
                        <h3>Playeras</h3>
                        <img src="/public/images/terrestre/playera.jpg" alt="Playeras">
                    </div>
                    <div class="tarjeta color-6">
                        <h3>Tenis para correr</h3>
                        <img src="/public/images/terrestre/tenis-blanco.jpg" alt="Tenis para correr">
                    </div>
                    <div class="tarjeta color-7">
                        <h3>Tenis para jugar</h3>
                        <img src="/public/images/terrestre/tenis-negro.jpg" alt="Tenis para jugar">
                    </div>
                    <div class="tarjeta color-8">
                        <h3>Ropa para mujer</h3>
                        <img src="/public/images/terrestre/top.jpg" alt="Ropa para mujer">
                    </div>
                    <div class="tarjeta color-9">
                        <h3>Uniformes</h3>
                        <img src="/public/images/terrestre/uniformes.jpg" alt="Uniformes">
                    </div>


                </div>

                <div id="serie-b" class="galeria">
                    <div class="tarjeta color-11">
                        <h3>Acceaorios para bucear</h3>
                        <img src="/public/images/acuatico/buceo.png" alt="Accesorios para bucear">
                    </div>
                    <div class="tarjeta color-12">
                        <h3>Gogles</h3>
                        <img src="/public/images/acuatico/gogles.png" alt="Gogles">
                    </div>
                    <div class="tarjeta color-13">
                        <h3>Gorras para nadar</h3>
                        <img src="/public/images/acuatico/gorra.png" alt="Gorras para nadar">
                    </div>
                    <div class="tarjeta color-14">
                        <h3>Sandalias</h3>
                        <img src="/public/images/acuatico/sandalias.png" alt="Sandalias">
                    </div>
                    <div class="tarjeta color-15">
                        <h3>Tablas de surf</h3>
                        <img src="/public/images/acuatico/tabla-surf.jpg" alt="Tablas de surf">
                    </div>
                    <div class="tarjeta color-16">
                        <h3>Toallas</h3>
                        <img src="/public/images/acuatico/toallas.png" alt="Toallas">
                    </div>
                    <div class="tarjeta color-17">
                        <h3>Traja de baño para hombre</h3>
                        <img src="/public/images/acuatico/traje-hombre.png" alt="Traje de baño para hombre">
                    </div>
                    <div class="tarjeta color-18">
                        <h3>Traje de baño pra mujer</h3>
                        <img src="/public/images/acuatico/traje-mujer.png" alt="Traje de baño para mujer">
                    </div>
                    <div class="tarjeta color-19">
                        <h3>Traje de baño para niña</h3>
                        <img src="/public/images/acuatico/traje-niña.png" alt="Traje de baño para niña">
                    </div>
                    <div class="tarjeta color-20">
                        <h3>Traje de baño para niño</h3>
                        <img src="/public/images/acuatico/traje-niño.png" alt="Traje de baño para niño">
                    </div>
                </div>
            </div>
        </div>
    </main>

    </div>
    <footer></footer>
    <script src="/src/js/pages/productos.js"></script>
</body>
</html>
